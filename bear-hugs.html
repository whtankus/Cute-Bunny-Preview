<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bear Hugs</title>
<style>
:root{--ink:#6b4a5e;--soft:#a98399;--chip:#f9e1ec;--chipOn:#e9b3cc;--card:rgba(255,255,255,.76);--bg1:#fff1f6;--bg2:#ece6ff;--ac:#bd789b;--line:rgba(189,120,155,.2);color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="dark"]{--ink:#f5dfea;--soft:#cfaac2;--chip:#4d3a58;--chipOn:#8a5a7c;--card:rgba(48,36,60,.82);--bg1:#2b2035;--bg2:#1f1b30;--ac:#f0a9c8;--line:rgba(240,169,200,.2)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 12% 8%,rgba(255,255,255,.7),transparent 32%),linear-gradient(135deg,var(--bg1),var(--bg2));background-attachment:fixed}
button:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
button:disabled{opacity:.55;cursor:not-allowed;transform:none}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;bottom:-40px;font-style:normal;color:#f4a9c6;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(-8deg);opacity:0}15%{opacity:.4}85%{opacity:.3}100%{transform:translateY(-105vh) rotate(10deg);opacity:0}}
.app{position:relative;max-width:780px;margin:0 auto;padding:18px 14px 30px;text-align:center}
h1{margin:6px 0 2px;font-size:30px;color:var(--ac)}
.back-link{display:inline-flex;align-items:center;gap:6px;margin:2px auto 10px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;color:var(--soft);font-size:12px;font-weight:700;text-decoration:none;background:var(--card)}
.back-link:hover{color:var(--ac);transform:translateY(-1px)}
.sub{color:var(--soft);margin-bottom:12px;font-size:14px}
.card{background:var(--card);border:1px solid rgba(255,255,255,.5);border-radius:26px;padding:14px;box-shadow:0 14px 44px #8d729522;backdrop-filter:blur(6px)}
.who{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:13px;align-items:center}
.who span{color:var(--soft)}
button{font:inherit;border:0;border-radius:14px;padding:11px 6px;font-size:14px;font-weight:600;color:var(--ink);background:var(--chip);cursor:pointer;transition:transform .15s,background .2s}
button:hover{transform:translateY(-2px)}button:active{transform:scale(.96)}
button.on{background:var(--chipOn);box-shadow:inset 0 0 0 1px var(--line)}
.who button{padding:7px 12px;font-size:13px}
.who button[aria-pressed="true"]{background:var(--chipOn)}
svg{display:block;width:100%;height:auto;border-radius:20px;background:linear-gradient(#fde7f0,#fbeee6 70%,#f8e6e9)}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}
.controls button b{display:block;font-size:22px;font-weight:400;line-height:1.2}
.row{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;margin-top:14px}
.row button{padding:9px 13px;font-size:12px}
.status{margin-top:12px;color:var(--ac);font-weight:600;min-height:22px}
.net{font-size:12px;color:var(--soft);margin-top:4px;min-height:16px;overflow-wrap:anywhere}
.meter{margin:15px auto 2px;max-width:430px;text-align:left}
.meter-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px;color:var(--soft);font-size:12px}
.meter-track{height:9px;border-radius:20px;background:var(--chip);overflow:hidden;border:1px solid var(--line)}
.meter-fill{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#e9a5c2,#c8a5ed);transition:width .55s cubic-bezier(.2,.8,.2,1)}
.meter-note{margin-top:6px;text-align:center;font-size:11px;color:var(--soft)}
@media(max-width:360px){.row{gap:6px}.row button{padding:8px 9px}.controls{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.controls{gap:6px}.controls button{font-size:11.5px;padding:9px 2px}h1{font-size:25px}}
@media(prefers-reduced-motion:reduce){.bg{display:none}.meter-fill,button{transition:none!important}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<main class="app">
<a class="back-link" href="./index.html">← Back to Cute Bunny</a>
<h1>Bear Hugs 🐻</h1>
<div class="sub">A little shared world for Mommy &amp; Daddy</div>
<div class="card">
<div class="who"><span>I am</span><button id="r0" class="on" type="button" aria-pressed="true">🤎 Daddy</button><button id="r1" type="button" aria-pressed="false">🤍 Mommy</button></div>
<svg id="sv" viewBox="90 120 420 270" role="img" aria-label="Daddy, a brown bear, and Mommy, a white bear, in a cozy pastel room"></svg>
<div class="controls" id="ctl" aria-label="Bear interactions"></div>
<div class="row">
<button id="snd" type="button" aria-pressed="true">🔊 Sound on</button>
<button id="theme" type="button" aria-pressed="false">🌙 Dark mode</button>
<button id="invite" type="button">💌 Copy invite</button>
</div>
<div class="meter" aria-label="Shared affection meter">
  <div class="meter-head"><span>♡ Shared little moments</span><strong id="meterValue">0 / 100</strong></div>
  <div class="meter-track" role="progressbar" aria-label="Affection meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="meterTrack"><div class="meter-fill" id="meterFill"></div></div>
  <div class="meter-note" id="meterNote">Every little interaction adds a little warmth.</div>
</div>
<div class="status" id="st" aria-live="polite">Daddy and Mommy are waiting for a hug.</div>
<div class="net" id="net" aria-live="polite"></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
"use strict";
// Optional cross-device sync: fill these two values with your Supabase project details.
// Realtime Broadcast uses a shared room link; it does not require a database table.
const APP_CONFIG = window.CUTE_BUNNY_CONFIG || {};
const SUPABASE_URL = APP_CONFIG.supabaseUrl || "";
const SUPABASE_ANON_KEY = APP_CONFIG.supabaseAnonKey || "";
const $=id=>document.getElementById(id),R=Math.PI/180,G=318,CX=[200,400],S=[1,-1],L1=24,L2=20,NAME=["Daddy","Mommy"];
const COL=[{fur:"#9b6a47",st:"#6e4529",bel:"#c99a74",muz:"#e9cfb3",ear:"#d79a86",bow:"#8d7bd0"},
{fur:"#fffaf3",st:"#dcc5b4",bel:"#fffdf9",muz:"#f6e6dc",ear:"#f7c3d1",bow:"#ef8fb1"}];
const ACTS=[["hug","🤗","Hug"],["kiss","💋","Kiss"],["hands","🫶","Hold Hands"],["feed","🍓","Feed"],["sleep","💤","Sleep"],["dance","💃","Dance"],["pet","🐾","Pet"],["idle","🌸","Relax"]];

/* ---------- background hearts ---------- */
for(let i=0;i<14;i++){const e=document.createElement("i");e.textContent="♥";e.style.cssText=`left:${Math.random()*100}%;font-size:${12+Math.random()*16}px;animation-duration:${14+Math.random()*14}s;animation-delay:${-Math.random()*26}s`;$("bg").appendChild(e)}

/* ---------- build scene ---------- */
function bear(i){const c=COL[i],st=`stroke="${c.st}" stroke-width="2.6"`;
const arm=n=>`<path id="${n}${i}o" fill="none" stroke="${c.st}" stroke-width="24.5" stroke-linecap="round" stroke-linejoin="round"/><circle id="${n}${i}co" r="14.2" fill="${c.st}"/><path id="${n}${i}f" fill="none" stroke="${c.fur}" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><g id="${n}${i}p"><circle r="12" fill="${c.fur}"/><ellipse cx="-3.5" cy="-3.5" rx="4.5" ry="3" fill="#fff" opacity=".25"/></g>`;
const eye=k=>`<g id="e${i}${k}"><ellipse id="ee${i}${k}" rx="4.4" ry="5.4" fill="#3d2f2d"/><circle cx="1.4" cy="-1.8" r="1.7" fill="#fff"/><path id="ea${i}${k}" fill="none" stroke="#3d2f2d" stroke-width="2.4" stroke-linecap="round" opacity="0"/></g>`;
return `<ellipse id="sh${i}" cy="${G+8}" rx="48" ry="8" fill="#9a6a86" opacity=".16"/>
<g id="s${i}"><g id="p${i}"><g id="bd${i}">
<g id="lg${i}l"><ellipse cx="-22" cy="-13" rx="19" ry="14" fill="${c.fur}" ${st}/><ellipse cx="-22" cy="-10" rx="9.5" ry="6.5" fill="${c.ear}" opacity=".85"/></g>
<g id="lg${i}r"><ellipse cx="22" cy="-13" rx="19" ry="14" fill="${c.fur}" ${st}/><ellipse cx="22" cy="-10" rx="9.5" ry="6.5" fill="${c.ear}" opacity=".85"/></g>
<ellipse cy="-50" rx="38" ry="40" fill="${c.fur}" ${st}/><ellipse cy="-46" rx="24" ry="28" fill="${c.bel}"/></g>
<g id="a${i}">${arm("o"+0)}${arm("i"+0)}</g>
<g id="h${i}"><circle cx="-43" cy="-76" r="15" fill="${c.fur}" ${st}/><circle cx="43" cy="-76" r="15" fill="${c.fur}" ${st}/><circle cx="-43" cy="-76" r="8" fill="${c.ear}"/><circle cx="43" cy="-76" r="8" fill="${c.ear}"/>
<ellipse cy="-38" rx="58" ry="48" fill="${c.fur}" ${st}/>
${i?`<g transform="translate(40 -88) rotate(20)"><path d="M0 0L-13-8 -13 8Z M0 0L13-8 13 8Z" fill="${c.bow}" stroke="#d3688f" stroke-width="1.5" stroke-linejoin="round"/><circle r="4" fill="#f9b6cd"/></g>`:""}
<ellipse id="bl${i}l" cx="-39" cy="-27" rx="10" ry="6" fill="#ff8fb0" opacity=".5"/><ellipse id="bl${i}r" cx="39" cy="-27" rx="10" ry="6" fill="#ff8fb0" opacity=".5"/>
<ellipse cy="-26" rx="15" ry="10.5" fill="${c.muz}"/><ellipse cy="-30" rx="5" ry="3.4" fill="#4a3433"/><circle cx="-1.3" cy="-31" r="1" fill="#fff" opacity=".7"/>
<path id="mo${i}" transform="translate(0 -22)" fill="#b2606d" stroke="#4a3433" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
${eye("l")}${eye("r")}</g></g></g>`}
$("sv").innerHTML=`<defs><radialGradient id="gl" cx=".5" cy=".4"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
<ellipse cx="300" cy="150" rx="280" ry="150" fill="url(#gl)"/>
<path d="M0 270Q110 215 230 262T440 250T600 240V380H0Z" fill="#f6d6e4" opacity=".75"/><path d="M0 300Q140 255 300 290T600 280V380H0Z" fill="#eadcf7" opacity=".8"/>
<g fill="#fff" opacity=".7"><ellipse cx="150" cy="160" rx="38" ry="12"/><ellipse cx="176" cy="152" rx="24" ry="12"/><ellipse cx="450" cy="172" rx="42" ry="12"/><ellipse cx="478" cy="163" rx="24" ry="11"/></g>
<ellipse cx="300" cy="${G+10}" rx="280" ry="36" fill="#fdeedd" stroke="#e9c6da" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>
<ellipse id="pil" cx="300" cy="${G-14}" rx="112" ry="22" fill="#f7d3e2" stroke="#e5b2c9" stroke-width="2.5" opacity="0"/>
<g id="bears">${bear(0)}${bear(1)}</g>
<rect id="blk" x="0" y="0" width="600" height="400" fill="#5b4a9a" fill-opacity=".24" opacity="0" pointer-events="none"/>
<g id="berry" opacity="0"><path d="M0 -10C-12 -11 -14 3 -8 11 -4 17 4 17 8 11 14 3 12 -11 0 -10Z" fill="#f0455f"/><g fill="#ffe7a8"><circle cx="-4" cy="0" r="1.2"/><circle cx="4" cy="-2" r="1.2"/><circle cx="0" cy="6" r="1.2"/><circle cx="5" cy="7" r="1.2"/><circle cx="-6" cy="8" r="1.2"/></g><path d="M0-10L-7-14 -3-9 0-15 3-9 7-14Z" fill="#6fbf73"/></g>
<g id="fx"></g>`;
ACTS.forEach(([a,e,l])=>{const b=document.createElement("button");b.id="b_"+a;b.type="button";b.setAttribute("aria-label",l);b.setAttribute("aria-pressed","false");b.innerHTML=`<b aria-hidden="true">${e}</b>${l}`;b.onclick=()=>perform(a,role);$("ctl").appendChild(b)});

/* ---------- pose engine ---------- */
const K=["x","y","rot","hr","hx","hy","eye","eh","mouth","pk","blush","i1","i2","o1","o2"];
const P=[0,1].map(()=>({x:0,y:0,rot:0,hr:0,hx:0,hy:0,eye:1,eh:1,mouth:0,pk:0,blush:.3,i1:-12,i2:-6,o1:12,o2:6}));
const ptL=(b,lx,ly)=>{const p=P[b],r=p.rot*R,vy=ly+50;return[CX[b]+S[b]*(p.x+lx*Math.cos(r)-vy*Math.sin(r)),G+p.y+lx*Math.sin(r)+vy*Math.cos(r)-50]};
const ptH=(b,hx,hy)=>{const p=P[b],r=p.hr*R;return ptL(b,p.hx+hx*Math.cos(r)-hy*Math.sin(r),-70+p.hy+hx*Math.sin(r)+hy*Math.cos(r))};
const toL=(b,wx,wy)=>{const p=P[b],r=p.rot*R,x1=S[b]*(wx-CX[b])-p.x,y1=wy-G-p.y+50;return[x1*Math.cos(r)+y1*Math.sin(r),-x1*Math.sin(r)+y1*Math.cos(r)-50]};
function ik(tx,ty){const sx=28,sy=-76;let dx=tx-sx,dy=ty-sy,d=Math.hypot(dx,dy);const m=L1+L2-.5;if(d>m){dx*=m/d;dy*=m/d;d=m}d=Math.max(d,10);
const tb=Math.atan2(-dx,dy),al=Math.acos(Math.max(-1,Math.min(1,(L1*L1+d*d-L2*L2)/(2*L1*d))));let best;
for(const g of[1,-1]){const a=tb+g*al,ex=sx-L1*Math.sin(a),ey=sy+L1*Math.cos(a);if(!best||ey>best.ey)best={a,ex,ey}}
const tt=Math.atan2(-(sx+dx-best.ex),sy+dy-best.ey);let a2=(tt-best.a)/R;a2=((a2+540)%360)-180;return[best.a/R,a2]}
const fk=(s,a1,a2)=>{const t1=a1*R,t2=(a1+a2)*R,ex=s-L1*Math.sin(t1),ey=-76+L1*Math.cos(t1);return[[s,-76],[ex,ey],[ex-L2*Math.sin(t2),ey+L2*Math.cos(t2)],t2/R]};

const V=[{},{}],EXP={eye:1,eh:1,mouth:1,pk:1,blush:1};let cur="idle",actor=0,role=0,t0=performance.now(),sleepF=0,berryS=1,rate=7;
const idle=(b,t)=>{const w=Math.sin(t*1.2+b*1.7);return{x:0,y:0,rot:w*1.2,hr:Math.sin(t*.8+b*2.3)*3+2,hx:0,hy:0,eye:1,eh:1,mouth:0,pk:0,blush:.3,i1:-12+w*2,i2:-6,o1:12-w*2,o2:6}};
const BITES=[1.4,2.8,4.0];
const ACT={
idle:()=>({}),
hug:(t,b)=>{const o=1-b,sq=t>1.4?Math.sin((t-1.4)*3.2):0,r={x:64+2*sq,y:-2.5*Math.abs(sq),rot:2,hr:12,hx:-18,hy:2*sq,eye:t>.9?.1:1,mouth:.1,blush:.9,o1:30,o2:20};
 if(t<.6)Object.assign(r,{i1:-82,i2:-8,o1:82,o2:8,hr:3,hx:0,x:36,y:-5*Math.abs(Math.sin(t*5))});else r.ik=ptL(o,-6,-58);return r},
kiss:(t,b)=>{const a=actor,o=1-a,go=t>.8&&t<2.6;
 if(b===a)return{x:go?68:50,rot:go?6:0,hr:go?22:5,hx:go?32:0,eye:go?.1:1,mouth:go?.3:.1,pk:go?1:0,blush:.7,ik:t>.4?ptL(o,-14,-66):null,i1:-40,i2:-10};
 const sh=t>1.2&&t<2.9;return{x:50,hr:sh?-4:6,hy:sh?-3:0,eye:t>1.25&&t<3?.1:1,mouth:.12,blush:t>1.2?1:.5,ik:sh?ptH(b,34,-24):null,i1:-40,i2:-10}},
hands:t=>({x:38,hr:8,eye:1,mouth:.2,blush:.7,ik:[300,G-52+Math.sin(t*2.2)*3.5],i1:-20,y:-1.5*Math.abs(Math.sin(t*2.2))}),
sleep:(t,b)=>({x:12,y:12,rot:72,hr:-48,hx:20,hy:2,eye:0,eh:0,mouth:0,blush:.45,i1:-32,i2:-12,o1:30,o2:12}),
dance:(t,b)=>{const ph=t*1.7*Math.PI,hop=Math.abs(Math.sin(ph)),sw=Math.sin(ph/2),sg=b?-1:1;
 return{x:38+12*sw*sg,y:-16*hop,rot:sg*sw*7,hr:sg*Math.sin(ph/2+.8)*10,hy:2*hop,eye:.1,mouth:.35+.4*hop,blush:.9,ik:[300+sw*10,G-98+Math.sin(ph*2)*5],o1:105+35*Math.sin(ph*2+b*Math.PI),o2:10}},
pet:(t,b)=>{const r=1-actor,sw=Math.sin(t*5);
 return b===actor?{x:64,hr:-5,hx:-8,mouth:.2,blush:.6,ik:(h=>[h[0]+sw*4,h[1]+Math.sin(t*5+1.2)*2.5])(ptH(r,-34,-50))}
 :{x:64,hr:14+sw*2,hx:16,hy:Math.abs(sw)*1.8,eye:.1,blush:1,mouth:.25}},
feed:(t,b)=>{const a=actor,r=1-a,open=(t>1.1&&t<1.7)||(t>2.65&&t<3)||(t>3.85&&t<4.2),chew=(t>1.7&&t<2.65)||(t>3&&t<3.85)||(t>4.2&&t<5.2);
 if(b===a){const k=t<.9?40:open?14:chew?34:t<5.2?34:44,M=ptH(r,0,-22);return{x:64,hr:-6,hx:-16,mouth:.25,blush:.6,ik:[M[0]-S[a]*k,M[1]+2]}}
 return{x:64,hr:open?12:chew?7:4,hx:open?8:chew?3:0,mouth:open?.9:chew?.2+.2*Math.abs(Math.sin(t*14)):t>5.2?.05:0,eye:chew?.12:1,blush:chew||t>5.2?.9:.5}}
};
const END={kiss:3.8,feed:6.8};

/* ---------- audio ---------- */
let ac,master,snd=true,nbuf;
function A(){if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C();master=ac.createGain();master.gain.value=(snd ? .9 : 0);master.connect(ac.destination);
 const n=ac.sampleRate*1.8|0,ib=ac.createBuffer(2,n,ac.sampleRate);for(let c=0;c<2;c++){const d=ib.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)}
 const cv=ac.createConvolver(),wg=ac.createGain();cv.buffer=ib;wg.gain.value=.3;master.connect(wg);wg.connect(cv);cv.connect(ac.destination);
 nbuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 if(ac.state==="suspended")ac.resume();return ac}
function tone(f,d,v=.05,ty="sine",dl=0,gl=0){if(!snd)return;const c=A();if(!c)return;const t=c.currentTime+dl,o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(gl)o.frequency.exponentialRampToValueAtTime(gl,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+Math.min(.03,d/3));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
function nz(d,v,f,ty="bandpass",dl=0,att=.01){if(!snd)return;const c=A();if(!c)return;const t=c.currentTime+dl,s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();s.buffer=nbuf;fl.type=ty;fl.frequency.value=f;fl.Q.value=.9;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+d+.05)}
const kiss=()=>{tone(280,.12,.04,"sine",0,400);nz(.025,.16,3400,"bandpass",.1);tone(1250,.08,.09,"sine",.1,380);nz(.05,.08,1300,"lowpass",.11);tone(1976,.4,.022,"sine",.2);tone(2637,.3,.012,"sine",.26)};
const crunch=()=>{for(let i=0;i<4;i++)nz(.022,.2-.03*i,2200+Math.random()*2600,"bandpass",i*.04);tone(130,.09,.08,"sine",0,70)};
const chew=n=>{for(let i=0;i<n;i++){const d=i*.26;nz(.13,.07,520+Math.random()*200,"lowpass",d);tone(230,.1,.03,"sine",d,150)}};
const yum=()=>{tone(392,.14,.05,"triangle",0,350);tone(523,.22,.045,"triangle",.14,600);tone(659,.4,.035,"sine",.3)};
const box=(f,d=0,v=.03)=>{tone(f,1.5,v,"sine",d);tone(f*2,.9,v*.3,"sine",d);tone(f*3,.5,v*.12,"sine",d)};
const breath=()=>{nz(1.6,.05,620,"bandpass",0,1.2);nz(1.7,.04,400,"bandpass",1.7,.3);tone(98,3.2,.014)};
const LULL=[[784,659,587,659],[784,784,784,0],[659,659,659,0],[784,988,988,0]];
const SC=[523,587,659,784,880],MEL=[0,2,4,2,3,2,1,-1,0,2,4,3,4,2,1,-1],BASS=[131,196,220,175];
const pluck=f=>{tone(f,.22,.05,"triangle");tone(f*2,.14,.015,"sine")};
const beat=n=>{const bt=n>>1;if(n%2===0){tone(125,.2,.14,"sine",0,42);if(bt%2)nz(.1,.09,1900);tone(BASS[(bt>>1)%4],.5,.05,"triangle")}else nz(.04,.03,7500,"highpass");const m=MEL[n%16];if(m>=0)pluck(SC[m])};
const pat=n=>{tone(230,.16,.06,"sine",0,150);tone(880,.6,.012,"sine",.02);if(n%4===0)tone(330,.7,.03,"triangle",.05,392)};
let tm=[],lp=[];const later=(f,ms)=>{const id=setTimeout(f,ms);tm.push(id);return id},loop=(f,ms)=>{f(0);let n=0;lp.push(setInterval(()=>f(++n),ms))};
const mid=()=>[300,G-90];

/* ---------- fx ---------- */
function fx(sym,x,y,col="#f4789f",sz=22){const e=document.createElementNS("http://www.w3.org/2000/svg","text");e.textContent=sym;e.setAttribute("x",x);e.setAttribute("y",y);e.setAttribute("fill",col);e.setAttribute("font-size",sz);e.setAttribute("text-anchor","middle");e.style.transformBox="fill-box";e.style.transformOrigin="center";$("fx").appendChild(e);
 const dx=(Math.random()-.5)*50;e.animate([{transform:"translate(0,0) scale(.4)",opacity:0},{opacity:1,offset:.25},{transform:`translate(${dx}px,-70px) scale(1.15)`,opacity:0}],{duration:1900,easing:"ease-out"}).onfinish=()=>e.remove()}
const burst=(x,y,n=5,sym="♥")=>{for(let i=0;i<n;i++)later(()=>fx(sym,x+(Math.random()-.5)*50,y,i%2?"#f4789f":"#d79ae8",16+Math.random()*14),i*130)};

/* ---------- actions ---------- */
const TXT=(a,by)=>{const o=1-by,n=NAME[by],m=NAME[o];return{hug:`${n} hugs ${m} 🤗`,kiss:`${n} gives ${m} a sweet kiss 💋`,hands:`${n} and ${m} hold paws 🫶`,feed:`${n} shares a strawberry with ${m} 🍓`,sleep:`${n} and ${m} drift off peacefully 💤`,dance:`${n} and ${m} are dancing together 💃`,pet:`${n} gently pets ${m} 🐾`,idle:`${n} and ${m} are relaxing 🌸`}[a]};
function start(a,by){tm.forEach(clearTimeout);lp.forEach(clearInterval);tm=[];lp=[];$("fx").innerHTML="";
 cur=a;actor=by;t0=performance.now();rate=a==="dance"?13:a==="sleep"?4.5:7;berryS=1;
 const ord=a==="feed"||a==="pet"||a==="kiss"?[1-by,by]:[0,1];ord.forEach(i=>$("bears").appendChild($("s"+i)));
 ACTS.forEach(([k])=>{const button=$("b_"+k);button.classList.toggle("on",k===a);button.setAttribute("aria-pressed",String(k===a))});$("st").textContent=TXT(a,by);
 if(a==="hug"){tone(262,1.4,.04);tone(330,1.4,.035,"sine",.06);tone(392,1.5,.03,"sine",.12);later(()=>{tone(196,1,.06,"triangle");tone(523,.9,.02,"sine",.1);burst(300,G-170,5)},1250)}
 if(a==="kiss"){later(()=>{kiss();burst(300,G-170,6)},1350);later(()=>{nz(.03,.1,2500);tone(900,.06,.05,"sine",0,500)},2600)}
 if(a==="hands"){later(()=>{[1047,1319,1568,2093,1568].forEach((f,i)=>tone(f,.55,.025,"sine",i*.08));burst(300,G-70,5,"✦")},800)}
 if(a==="feed"){BITES.forEach((b,index)=>later(()=>{crunch();later(()=>chew(3),220);if(index===2)later(yum,500)},b*1000));later(()=>burst(CX[1-by]+S[1-by]*30,G-190,4),5600)}
 if(a==="sleep"){loop(n=>{breath();LULL[n%4].forEach((f,k)=>f&&box(f,k*.8));if(n%2===0)later(()=>fx("z",300+(Math.random()-.5)*60,G-100,"#9b86d6",20+Math.random()*10),500)},3400)}
 if(a==="dance"){loop(n=>{beat(n);if(n%4===0)fx("♪",300+(Math.random()-.5)*120,G-170,"#b08be0",22)},294)}
 if(a==="pet"){tone(300,.5,.03,"triangle");loop(n=>{pat(n);if(n%2==0){const h=ptH(1-by,0,-80);fx("♥",h[0],h[1]-20,"#f4789f",16)}},628)}
 if(a==="idle"){tone(392,.7,.025,"sine",0,330)}
 if(END[a])later(()=>{if(cur===a)start("idle",by)},END[a]*1000)}
/* ---------- room identity + cross-device sync ---------- */
const seen=new Set();let channel=null,bc=null,client=null;
function makeId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():`room-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,10)}`}
function getRoomId(){
  const params=new URLSearchParams(location.search);let id=params.get("room");
  if(!id){try{id=localStorage.getItem("bh-room-id")}catch(e){}if(!id)id=makeId();params.set("room",id);try{localStorage.setItem("bh-room-id",id)}catch(e){}history.replaceState(null,"",`${location.pathname}?${params.toString()}${location.hash}`)}
  return id.slice(0,100).replace(/[^a-zA-Z0-9_-]/g,"")||"bear-hugs-room";
}
const roomId=getRoomId();
function recv(m){if(!m||typeof m!=="object"||!Object.hasOwn(ACT,m.a)||(m.by!==0&&m.by!==1)||typeof m.n!=="string"||seen.has(m.n))return;seen.add(m.n);if(seen.size>250){const first=seen.values().next().value;seen.delete(first)}start(m.a,m.by);syncAffection(m.affection)}
try{if(window.BroadcastChannel){bc=new BroadcastChannel(`bear-hugs:${roomId}`);bc.onmessage=e=>recv(e.data)}}catch(e){bc=null}
async function connectRealtime(){
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY||!window.supabase?.createClient){
    $("net").textContent="Solo mode · this browser's tabs can sync. Add Supabase keys to enable sharing across devices.";
    return;
  }
  try{
    client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    channel=client.channel(`bear-hugs:${roomId}`,{config:{broadcast:{self:false}}});
    channel.on("broadcast",{event:"bear-action"},({payload})=>recv(payload));
    channel.subscribe(status=>{
      if(status==="SUBSCRIBED")$("net").textContent="💞 Connected · actions are shared with this invite room.";
      else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT")$("net").textContent="Connection issue · local animations still work. Check Supabase Realtime settings.";
      else if(status==="CLOSED")$("net").textContent="Disconnected · local animations still work.";
    });
  }catch(error){console.warn("Bear Hugs realtime connection failed:",error);$("net").textContent="Solo mode · realtime connection could not be started."}
}
connectRealtime();

/* ---------- affection meter ---------- */
const POINTS={hug:6,kiss:8,hands:5,feed:6,sleep:3,dance:5,pet:4,idle:1};
let affection=0;
try{affection=Math.max(0,Math.min(100,Number(localStorage.getItem("bh-affection"))||0))}catch(e){}
function renderMeter(){
  $("meterFill").style.width=`${affection}%`;
  $("meterValue").textContent=`${affection} / 100`;
  $("meterTrack").setAttribute("aria-valuenow",String(affection));
  $("meterNote").textContent=affection>=100?"A hundred little moments of love. You filled the meter!":affection>=70?"So much warmth in your little world.":affection>=35?"Your shared world is growing warmer.":"Every little interaction adds a little warmth.";
}
function saveAffection(){try{localStorage.setItem("bh-affection",String(affection))}catch(e){}renderMeter()}
function addAffection(action){affection=Math.min(100,affection+(POINTS[action]||0));saveAffection()}
function syncAffection(value){if(Number.isFinite(value)){affection=Math.max(affection,Math.min(100,Math.max(0,value)));saveAffection()}}
renderMeter();

/* ---------- actions + roles + controls ---------- */
function perform(a,by){const n=makeId();seen.add(n);start(a,by);addAffection(a);const msg={a,by,n,affection};if(bc)bc.postMessage(msg);if(channel){channel.send({type:"broadcast",event:"bear-action",payload:msg}).then(result=>{if(result?.error)console.warn("Bear Hugs broadcast failed:",result.error)}).catch(error=>console.warn("Bear Hugs broadcast failed:",error))}}
function setRole(r){role=r;$("r0").classList.toggle("on",!r);$("r1").classList.toggle("on",!!r);$("r0").setAttribute("aria-pressed",String(!r));$("r1").setAttribute("aria-pressed",String(!!r));try{localStorage.setItem("bh-role",r)}catch(e){}}
$("r0").onclick=()=>setRole(0);$("r1").onclick=()=>setRole(1);
try{const r=localStorage.getItem("bh-role");if(r==="1")setRole(1)}catch(e){}
$("snd").onclick=()=>{snd=!snd;$("snd").textContent=snd?"🔊 Sound on":"🔇 Sound off";$("snd").setAttribute("aria-pressed",String(snd));if(master){master.gain.setTargetAtTime((snd ? .9 : 0),ac.currentTime,.04)}if(snd){tone(659,.2,.05);tone(880,.3,.05,"sine",.12)}};
$("theme").onclick=()=>{const dark=document.documentElement.dataset.theme!=="dark";document.documentElement.dataset.theme=dark?"dark":"light";$("theme").textContent=dark?"☀️ Light mode":"🌙 Dark mode";$("theme").setAttribute("aria-pressed",String(dark));try{localStorage.setItem("bh-theme",dark?"dark":"light")}catch(e){}};
try{const savedTheme=localStorage.getItem("bh-theme");if(savedTheme){document.documentElement.dataset.theme=savedTheme;const dark=savedTheme==="dark";$("theme").textContent=dark?"☀️ Light mode":"🌙 Dark mode";$("theme").setAttribute("aria-pressed",String(dark))}else if(window.matchMedia?.("(prefers-color-scheme: dark)").matches){document.documentElement.dataset.theme="dark";$("theme").textContent="☀️ Light mode";$("theme").setAttribute("aria-pressed","true")}}catch(e){}
$("invite").onclick=async()=>{const url=location.href;try{await navigator.clipboard.writeText(url);$("invite").textContent="✓ Invite copied";$("net").textContent=channel?"Share this invite link. Both people will join the same live room.":"Invite copied. Cross-device sync needs Supabase keys configured in this file.";later(()=>$("invite").textContent="💌 Copy invite",2200)}catch(e){$("net").textContent=`Copy this invite link: ${url}`}};
addEventListener("pointerdown",()=>{if(snd)A()},{once:true});

/* ---------- render loop ---------- */
const blink=[{n:1.5,u:0},{n:3,u:0}];let last=performance.now();const reduceMotion=window.matchMedia?.("(prefers-reduced-motion: reduce)").matches??false;
const setT=(id,v)=>$(id).setAttribute("transform",v);
function drawArm(b,n,s,a1,a2){const f=fk(s,a1,a2),d=`M${f[0][0]} ${f[0][1]}Q${f[1][0]} ${f[1][1]} ${f[2][0]} ${f[2][1]}`,id=n+0+b;
 $(id+"o").setAttribute("d",d);$(id+"f").setAttribute("d",d);$(id+"co").setAttribute("cx",f[2][0]);$(id+"co").setAttribute("cy",f[2][1]);setT(id+"p",`translate(${f[2][0]} ${f[2][1]}) rotate(${f[3]})`);return f}
function frame(now){const dt=Math.min(.05,(now-last)/1e3);last=now;const t=(now-t0)/1e3,ts=now/1e3,k=1-Math.exp(-dt*rate);
 sleepF+=((cur==="sleep"?1:0)-sleepF)*(1-Math.exp(-dt*2.5));
 const tg=[0,1].map(b=>{const o=Object.assign(idle(b,ts),ACT[cur](t,b));if(o.ik){const[a1,a2]=ik(...toL(b,o.ik[0],o.ik[1]));o.i1=a1;o.i2=a2}return o});
 for(let b=0;b<2;b++){const p=P[b],g=tg[b];for(const key of K){if(EXP[key])p[key]+=(g[key]-p[key])*(1-Math.exp(-dt*(key==="eye"?16:9)));else{const arm=key[0]==="i"||key[0]==="o",w=(arm?1.25:1)*rate*1.15,z=arm?.72:.78,vv=V[b];vv[key]=(vv[key]||0)+((g[key]-p[key])*w*w-2*z*w*(vv[key]||0))*dt;p[key]+=vv[key]*dt}}
 const br=reduceMotion?0:Math.sin(ts*(sleepF>.5?1.5:2.1)+b),bs=1+br*(.012+.02*sleepF),bl=blink[b];
 if(!reduceMotion&&ts>bl.n){bl.u=ts;bl.n=ts+2.5+Math.random()*3}const bf=!reduceMotion&&ts-bl.u<.14?.1:1;
 setT("s"+b,`translate(${CX[b]} ${G+p.y}) scale(${S[b]} 1)`);setT("p"+b,`translate(${p.x} 0) rotate(${p.rot} 0 -50)`);
 {const mv=reduceMotion?0:(cur==="dance"?1:Math.min(1,Math.abs(V[b].x||0)/22)),ph=ts*(cur==="dance"?1.7*Math.PI*2:13),ll=Math.max(0,Math.sin(ph))*mv,lr=Math.max(0,-Math.sin(ph))*mv,sp=sleepF*14;
 setT("lg"+b+"l",`translate(0 ${-ll*7}) rotate(${-ll*10-sp} -22 -22)`);setT("lg"+b+"r",`translate(0 ${-lr*7}) rotate(${lr*10+sp} 22 -22)`)}
 setT("bd"+b,`translate(0 -10) scale(1 ${bs}) translate(0 10)`);
 setT("h"+b,`translate(${p.hx} ${-70+p.hy-br*(.8+sleepF)}) rotate(${p.hr})`);
 drawArm(b,"o",-28,p.o1,p.o2);drawArm(b,"i",28,p.i1,p.i2);
 const cl=p.eye<.25,op=Math.max(.06,p.eye*bf);
 for(const e of["l","r"]){const x=e==="l"?-26:26;setT("e"+b+e,`translate(${x} -36)`);const ee=$("ee"+b+e);ee.setAttribute("ry",5.4*op);ee.style.opacity=cl?0:1;
  const ea=$("ea"+b+e);ea.setAttribute("d",`M-5.5 ${p.eh>.5?2:-1}Q0 ${p.eh>.5?-5:6} 5.5 ${p.eh>.5?2:-1}`);ea.style.opacity=cl?1:0;$("bl"+b+e).style.opacity=Math.min(1,p.blush)}
 const m=Math.max(0,p.mouth),w=6.5-3.5*p.pk,tp=6*(1-m*.9),bt=6+16*m;
 $("mo"+b).setAttribute("d",`M${-w} 0Q0 ${tp} ${w} 0Q0 ${bt} ${-w} 0Z`);
 const sh=$("sh"+b);sh.setAttribute("cx",CX[b]+S[b]*p.x);sh.setAttribute("rx",48-p.y*.7);sh.setAttribute("opacity",.16*(1-sleepF)*(1+p.y/60))}
 $("pil").setAttribute("opacity",sleepF);$("blk").setAttribute("opacity",sleepF);
 const bs=$("berry");if(cur==="feed"&&t<5.3){const f=fk(28,P[actor].i1,P[actor].i2),h=f[2],rad=f[3]*R,wp=ptL(actor,h[0]-Math.sin(rad)*8,h[1]+Math.cos(rad)*8),sc=t<1.7?1:t<3?.66:t<4.2?.36:0;
  berryS+=(sc-berryS)*(1-Math.exp(-dt*14));bs.setAttribute("transform",`translate(${wp[0]} ${wp[1]}) scale(${berryS*.9}) rotate(${-S[actor]*20})`);bs.setAttribute("opacity",berryS>.05?1:0)}else bs.setAttribute("opacity",0);
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
