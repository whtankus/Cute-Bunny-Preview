name: One-time mirror from Cute-bunny

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Preview
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace Preview main with Cute-bunny main
        run: |
          git remote add upstream https://github.com/whtankus/Cute-bunny.git
          git fetch upstream main
          git push origin FETCH_HEAD:refs/heads/main --force
